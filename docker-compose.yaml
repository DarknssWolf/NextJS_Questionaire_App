services:
  postgres:
    image: postgres:17-alpine
    container_name: questionnaire-app-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: questionnaire_app
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d questionnaire_app']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
